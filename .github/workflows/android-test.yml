name: Android test APK
on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build test APK and check Android sources
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease :app:lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Yarisma-Arenasi-test-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Yarisma-Arenasi-unsigned-AAB
          path: android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
