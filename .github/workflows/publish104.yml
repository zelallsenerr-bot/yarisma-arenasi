name: Publish Yarışma Atölyesi
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish104.yml'
      - 'migration104/**'
      - 'site104/**'
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify complete Sites104 snapshot
        run: python3 migration104/verify_snapshot.py
      - name: Upload current game site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: site104
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
