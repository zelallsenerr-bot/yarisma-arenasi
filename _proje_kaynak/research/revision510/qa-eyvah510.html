<!doctype html><meta charset="utf-8"><title>Eyvah kapak kontrolü</title><style>body{margin:0;background:#081126;color:white}button{padding:12px}iframe{width:100%;height:800px;border:0}</style><button id="drop">Numaralı kapak düşüşünü başlat</button><button id="center">Merkez kapağı düşüşünü başlat</button><button id="resume">Sürdür</button><span id="status">Test sahnesi hazırlanıyor</span><iframe id="game" src="games/eyvah-dusuyorum/index.html"></iframe><script>
const f=document.getElementById('game'),status=document.getElementById('status');let timer;f.onload=()=>status.textContent='Hazır';function run(center){clearInterval(timer);const w=f.contentWindow;w.X318.resume();w.Exp318Game.start();w.Exp318Game.fallPick366(0);w.Exp318Game.fallLose(center);w.Exp318Test.tick(Math.max(0,w.X318.s.drop202.delay-1.5));status.textContent='Sohbet sürüyor';timer=setInterval(()=>{const s=w.X318.s;if(s.phase!=='fall'){clearInterval(timer);return}const age=s.drop202.total-s.remaining-s.drop202.delay;if(age>.37){w.X318.stop();status.textContent='Kapak açık; beden tepkisi duraklatıldı';clearInterval(timer)}},30)}document.getElementById('drop').onclick=()=>run(false);document.getElementById('center').onclick=()=>run(true);document.getElementById('resume').onclick=()=>f.contentWindow.X318.resume();</script>
