name: Publish Sites 104
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish104.yml'
      - 'migration104/**'
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Copy and verify the exact published Sites104 snapshot
        run: python3 migration104/fetch_snapshot.py
      - name: Preserve verified game files in this repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site104
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve verified Sites104 game snapshot [skip ci]'
            git push origin HEAD:main
          fi
      - name: Upload only the current game site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site104
  deploy:
    needs: snapshot
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy verified Sites104
        id: deployment
        uses: actions/deploy-pages@v4
