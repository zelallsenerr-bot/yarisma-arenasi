<!doctype html><meta charset="utf-8"><title>Güven Masası görsel kontrolü</title><style>body{font:20px system-ui;padding:40px;background:#14233c;color:#fff}button{padding:20px;margin:10px}</style><h1>Güven Masası görsel kontrolü</h1><p>Eski kadın rakip kaydını iki ekranda aç.</p><button id="portraits">Portre ekranını aç</button><button id="face">Yüzleşme ekranını aç</button><button id="restore">Önceki kaydı geri yükle</button><script>
const key='arena-game:guven-cizgisi:guven-save-v39',backup='qa-trust-backup445';function seed(phase){if(localStorage.getItem(backup)===null)localStorage.setItem(backup,JSON.stringify({value:localStorage.getItem(key)}));localStorage.setItem(key,JSON.stringify({a:'Mustafa',b:'Deniz',visualA37:'cast346-0-0',visualB37:'cast346-1-0',mode:'local',personality:'loyal',round:3,bank:30000,wrong:0,used:[],history:[],trust:70,phase}));location.href='games/guven-cizgisi/'}document.getElementById('portraits').onclick=()=>seed('risk');document.getElementById('face').onclick=()=>seed('faceintro');document.getElementById('restore').onclick=()=>{const b=JSON.parse(localStorage.getItem(backup)||'null');if(b){if(b.value===null)localStorage.removeItem(key);else localStorage.setItem(key,b.value);localStorage.removeItem(backup)}location.href='games/guven-cizgisi/'};
</script>
