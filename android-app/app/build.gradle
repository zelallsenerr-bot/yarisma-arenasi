plugins { id 'com.android.application' }
android {
 namespace 'com.yarismaatolyesi.arena'
 compileSdk 36
 defaultConfig {
  applicationId 'com.yarismaatolyesi.arena'
  minSdk 26
  targetSdk 36
  versionCode providers.gradleProperty('playVersionCode').getOrElse('2').toInteger()
  versionName '1.1'
 }
 sourceSets.main.assets.srcDir rootProject.file('../play-edition')
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
